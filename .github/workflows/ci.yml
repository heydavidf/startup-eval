# Automatic checks for the startup-eval skill repository. They mirror the Checks section of AGENTS.md.
# Runs on every push to main, on pull requests, weekly (the weekly run also checks external links) and on demand.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Poppler (needed by prepare_pdf.py and the pipeline test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Lint and format (ruff)
        run: |
          pipx run --spec ruff==0.17.1 ruff check .
          pipx run --spec ruff==0.17.1 ruff format --check .

      - name: Tests (skills/ layout guard, offline script pipeline)
        run: python -m unittest discover -s tests -v

      - name: Example rebuild is byte-identical, example validates
        run: |
          python examples/fictional-tidewell/build_example.py
          if [ -n "$(git status --porcelain -- examples/)" ]; then
            echo "Rebuilding the example changed committed files:"
            git status --short -- examples/
            exit 1
          fi
          python skills/startup-eval/scripts/validate_evaluation.py examples/fictional-tidewell

      - name: Agent Skills spec (skills-ref, pinned)
        run: |
          python -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet 'skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          for skill in skills/*/; do
            "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate "$skill"
          done

      - name: Tripwire (personal paths, junk files, library content, silenced checks)
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && git cat-file -e "$BASE_REF" 2>/dev/null; then bash .github/tripwire.sh "$BASE_REF"; else bash .github/tripwire.sh; fi

      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is read-only, so report findings in the job log instead of as pull request comments.
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Links (local on every run, external weekly)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ github.event_name == 'schedule' && '--no-progress .' || '--offline --no-progress .' }}
          fail: true
